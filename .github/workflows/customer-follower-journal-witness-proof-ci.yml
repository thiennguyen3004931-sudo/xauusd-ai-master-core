name: Customer Follower Journal Witness Proof (Synthetic Only)

on:
  pull_request:
    paths:
      - 'scripts/customer-follower-journal-witness-compare.mjs'
      - 'scripts/customer-follower-journal-canonical-state.mjs'
      - 'scripts/customer-follower-journal-canonical-state.test.mjs'
      - 'scripts/customer-follower-journal-checkpoint-cas.mjs'
      - 'scripts/customer-follower-journal-witness-compare.test.mjs'
      - 'scripts/customer-follower-journal-witness-README.md'
      - 'scripts/customer-restore-authority-file-fixture.mjs'
      - '.github/workflows/customer-follower-journal-witness-proof-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  follower-journal-witness-synthetic:
    name: Follower rollback and fork negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify witness fail-closed contract (no broker / MT5)
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$EXPECTED_HEAD"
          echo "CHECKED_OUT_HEAD=$checked_out_head"
          node --test scripts/customer-follower-journal-witness-compare.test.mjs
          node --test scripts/customer-follower-journal-canonical-state.test.mjs
      - name: Safety declaration
        shell: bash
        run: |
          echo 'SYNTHETIC_PROOF_ONLY=true'
          echo 'JOURNAL_SNAPSHOT_SYNTHETIC_ONLY=true'
          echo 'CHECKPOINT_CAS_FIXTURE_ONLY=true'
          echo 'BROKER_EXECUTION_ALLOWED=false'
          echo 'WITNESS_BACKEND_IMPLEMENTED=false'
          echo 'CUSTOMER_RELEASE_AUTHORIZED=false'

  follower-journal-windows-crash:
    name: Windows WAL and checkpoint reopen after worker termination
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run both synthetic process termination cases
        shell: powershell
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_HEAD -or $env:RUNNER_OS -cne 'Windows') {
            throw 'WINDOWS_FOLLOWER_CRASH_TEST_CONTEXT_INVALID'
          }
          Write-Host "CHECKED_OUT_HEAD=$head"
          $tap = @(& node --test --test-reporter=tap '--test-name-pattern=^Abrupt worker exit after ' scripts/customer-follower-journal-witness-compare.test.mjs)
          $testExit = $LASTEXITCODE
          $tap | Write-Host
          if ($testExit -ne 0 -or $tap -notcontains '# tests 2' -or $tap -notcontains '# pass 2') {
            throw 'WINDOWS_FOLLOWER_CRASH_TESTS_NOT_VERIFIED'
          }
