name: Phase7C Web Startup Diagnostics 20261105 (Read Only)

# The approved start was attempted in run 42004828496. This revision collects
# evidence only; it never repeats the mode change or the Web task start.

# Authorized by the user's approval of SEMI -> PAUSE, Web/API recovery, stay PAUSE.
on:
  push:
    branches: [ops/web-recovery-approved-20261105]
    paths:
      - '.github/workflows/phase7c-web-recovery-approved-20261105.yml'

permissions:
  contents: read

concurrency:
  group: phase7c-approved-web-recovery-20261105
  cancel-in-progress: false

jobs:
  observe-startup:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test mode approval, CRLF provenance, idempotence and pause barrier
        shell: powershell
        run: node --experimental-strip-types --test scripts/ops/set-phase7c-pause-for-web-recovery.test.mjs
      - name: Validate existing recovery and GET-only contracts
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-phase7c-manual-web-task-recovery-source.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CANONICAL_RECOVERY_CONTRACT_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-phase7c-one-shot-web-evidence-readonly-source.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CANONICAL_READONLY_CONTRACT_FAILED' }
      - name: Parse read-only startup diagnostics
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/ops/observe-phase7c-web-startup-readonly-20261105.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'WEB_STARTUP_DIAGNOSTIC_PARSE_FAILED' }
      - name: Observe scheduler conditions and Web startup without another start
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ops/observe-phase7c-web-startup-readonly-20261105.ps1
