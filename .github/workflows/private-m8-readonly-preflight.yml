name: M8 Post-Failure Read-Only Diagnostics

on:
  push:
    branches:
      - ops/m8-approved-cutover-f142d628
    paths:
      - ".github/workflows/private-m8-readonly-preflight.yml"

permissions:
  contents: read

env:
  PRODUCTION_ROOT: 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'

jobs:
  diagnose:
    name: m8-post-failure-readonly-diagnostics
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout target source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read production source and runtime diagnostics
        shell: powershell
        run: |
          $root = $env:PRODUCTION_ROOT
          Write-Host "DIAG_PRODUCTION_ROOT=$root"
          Push-Location $root
          try {
            Write-Host "DIAG_BRANCH=$((git branch --show-current).Trim())"
            Write-Host "DIAG_HEAD=$((git rev-parse HEAD).Trim())"
            Write-Host "DIAG_TREE=$((git rev-parse 'HEAD^{tree}').Trim())"
            $dirty = @(git status --porcelain --untracked-files=normal)
            Write-Host "DIAG_DIRTY_COUNT=$($dirty.Count)"
          } finally { Pop-Location }

          foreach ($taskName in @('XAUUSD-Phase7B-Web','XAUUSD-Phase7C-Executors')) {
            try {
              $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
              $info = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
              Write-Host "DIAG_TASK=$taskName|STATE=$($task.State)|LAST_RESULT=$($info.LastTaskResult)|LAST_RUN=$($info.LastRunTime)|NEXT_RUN=$($info.NextRunTime)"
              foreach ($a in @($task.Actions)) {
                Write-Host "DIAG_TASK_ACTION=$taskName|EXECUTE=$($a.Execute)|ARGUMENTS=$($a.Arguments)"
              }
            } catch { Write-Host "DIAG_TASK=$taskName|ERROR=$($_.Exception.Message)" }
          }

          foreach ($port in @(3711,5717,8765)) {
            $listeners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            if ($listeners.Count -eq 0) { Write-Host "DIAG_PORT=$port|LISTEN=FALSE"; continue }
            foreach ($l in $listeners) {
              $proc = Get-CimInstance Win32_Process -Filter "ProcessId=$($l.OwningProcess)" -ErrorAction SilentlyContinue
              Write-Host "DIAG_PORT=$port|LISTEN=TRUE|PID=$($l.OwningProcess)|NAME=$($proc.Name)|CMD=$($proc.CommandLine)"
            }
          }

          $logDir = Join-Path $root '.runtime\phase7b-web'
          foreach ($name in @('api.out.log','api.err.log','web.out.log','web.err.log')) {
            $path = Join-Path $logDir $name
            Write-Host "DIAG_LOG_BEGIN=$name"
            if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Tail 160 } else { Write-Host 'MISSING' }
            Write-Host "DIAG_LOG_END=$name"
          }

          $statePath = Join-Path $root '.runtime\phase7c-lifecycle-broker\state\state.json'
          if (Test-Path -LiteralPath $statePath) {
            Write-Host 'DIAG_BROKER_STATE_BEGIN'
            Get-Content -LiteralPath $statePath -Raw
            Write-Host 'DIAG_BROKER_STATE_END'
          }

          Write-Host 'DIAG_PRODUCTION_MUTATION=NONE'
          Write-Host 'DIAG_ORDER_MUTATION=NONE'
          Write-Host 'DIAG_POSITION_MUTATION=NONE'
          Write-Host 'DIAG_ARM_MUTATION=NONE'
