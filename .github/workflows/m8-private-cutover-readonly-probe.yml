name: M8 Bridge Process Read-Only Evidence

on:
  push:
    branches:
      - diag/m8-readonly-preflight-b399d2f3
    paths:
      - ".github/workflows/m8-private-cutover-readonly-probe.yml"

permissions:
  contents: read

jobs:
  bridge-process-evidence:
    name: bridge-process-evidence
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Inspect bridge process tree and safe error tail
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDir = "F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master\.runtime\phase7c-account-bridge"
          $statusPath = Join-Path $runtimeDir "startup-runner-status.json"
          Write-Host "READ_ONLY=TRUE"
          Write-Host "PROCESS_MUTATION=NONE"
          Write-Host "BRIDGE_RESTART=NONE"

          $status = Get-Content -LiteralPath $statusPath -Raw | ConvertFrom-Json
          $runnerPid = [int]$status.runnerPid
          $childPid = [int]$status.bridgeProcessPid
          Write-Host "BRIDGE_RUNNER_PID=$runnerPid"
          Write-Host "BRIDGE_CHILD_PID=$childPid"

          $all = @(Get-CimInstance Win32_Process)
          $direct = @($all | Where-Object { [int]$_.ParentProcessId -eq $childPid })
          Write-Host "BRIDGE_CHILD_DIRECT_DESCENDANTS=$($direct.Count)"
          foreach ($p in $direct) {
            Write-Host "BRIDGE_DESCENDANT_PID=$($p.ProcessId)|PARENT=$($p.ParentProcessId)|NAME=$($p.Name)"
          }

          $level2 = New-Object System.Collections.Generic.List[object]
          foreach ($parent in $direct) {
            foreach ($p in @($all | Where-Object { [int]$_.ParentProcessId -eq [int]$parent.ProcessId })) { [void]$level2.Add($p) }
          }
          Write-Host "BRIDGE_DESCENDANT_LEVEL2_COUNT=$($level2.Count)"
          foreach ($p in $level2) {
            Write-Host "BRIDGE_DESCENDANT_L2_PID=$($p.ProcessId)|PARENT=$($p.ParentProcessId)|NAME=$($p.Name)"
          }

          foreach ($logName in @('bridge.err.log','startup-runner.err.log')) {
            $logPath = Join-Path $runtimeDir $logName
            Write-Host "BRIDGE_SAFE_LOG_BEGIN=$logName"
            if (Test-Path -LiteralPath $logPath -PathType Leaf) {
              $raw = @(Get-Content -LiteralPath $logPath -Tail 120 -ErrorAction SilentlyContinue)
              $matches = @($raw | Where-Object {
                $_ -match '(?i)traceback|error|exception|failed|failure|exited|retry|refused|uvicorn|python|initialize|connection|timeout|winerror|address|bind|port'
              } | Where-Object { $_ -notmatch '(?i)api[_-]?key|token|password|secret' } | Select-Object -Last 25)
              Write-Host "BRIDGE_SAFE_LOG_MATCH_COUNT=$($matches.Count)"
              foreach ($line in $matches) {
                $safe = [string]$line
                $safe = $safe -replace '\b\d{7,}\b','<number-redacted>'
                Write-Host "BRIDGE_SAFE_LOG_LINE=$safe"
              }
            } else {
              Write-Host "BRIDGE_SAFE_LOG_MISSING=True"
            }
            Write-Host "BRIDGE_SAFE_LOG_END=$logName"
          }

      - name: Safety boundary
        if: always()
        shell: powershell
        run: |
          Write-Host "PRODUCTION_CUTOVER=NOT_PERFORMED"
          Write-Host "MODE_MUTATION=NONE"
          Write-Host "ARM_MUTATION=NONE"
          Write-Host "PROCESS_MUTATION=NONE"
          Write-Host "TASK_MUTATION=NONE"
          Write-Host "ORDER_MUTATION=NONE"
          Write-Host "POSITION_MUTATION=NONE"
