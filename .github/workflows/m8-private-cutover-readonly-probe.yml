name: M8 Production Git Identity Read-Only

on:
  push:
    branches:
      - diag/m8-readonly-preflight-b399d2f3
    paths:
      - ".github/workflows/m8-private-cutover-readonly-probe.yml"

permissions:
  contents: read

jobs:
  production-git-identity:
    name: production-git-identity
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Read production Git identity and target reachability
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = "F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master"
          $target = "b399d2f3ccd0bfbeb35699a890f681ae28afbbac"
          Write-Host "READ_ONLY=TRUE"
          Write-Host "GIT_MUTATION=NONE"
          $head = (git -C $root rev-parse HEAD).Trim()
          $tree = (git -C $root rev-parse "HEAD^{tree}").Trim()
          $branchName = (git -C $root branch --show-current).Trim()
          $origin = (git -C $root remote get-url origin).Trim()
          $dirty = @(git -C $root status --porcelain --untracked-files=normal)
          Write-Host "PRODUCTION_GIT_HEAD=$head"
          Write-Host "PRODUCTION_GIT_TREE=$tree"
          Write-Host "PRODUCTION_GIT_BRANCH=$branchName"
          Write-Host "PRODUCTION_GIT_ORIGIN=$origin"
          Write-Host "PRODUCTION_GIT_DIRTY_COUNT=$($dirty.Count)"

          $remoteRaw = @(git -C $root ls-remote --heads origin refs/heads/main)
          if ($LASTEXITCODE -eq 0 -and $remoteRaw.Count -eq 1) {
            $remoteMain = ([string]$remoteRaw[0]).Split([char]9)[0].Trim()
            Write-Host "PRODUCTION_ORIGIN_MAIN=$remoteMain"
          } else { Write-Host "PRODUCTION_ORIGIN_MAIN=UNAVAILABLE" }

          git -C $root cat-file -e "$target^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "PRODUCTION_LOCAL_HAS_TARGET_COMMIT=True"
            git -C $root merge-base --is-ancestor $head $target
            Write-Host "PRODUCTION_HEAD_IS_ANCESTOR_OF_TARGET=$($LASTEXITCODE -eq 0)"
          } else {
            Write-Host "PRODUCTION_LOCAL_HAS_TARGET_COMMIT=False"
            Write-Host "PRODUCTION_HEAD_IS_ANCESTOR_OF_TARGET=UNKNOWN"
          }

          Write-Host "PRODUCTION_CUTOVER=NOT_PERFORMED"
          Write-Host "MODE_MUTATION=NONE"
          Write-Host "ARM_MUTATION=NONE"
          Write-Host "PROCESS_MUTATION=NONE"
