name: M8 Private Cutover Read-Only Acceptance

on:
  push:
    branches:
      - diag/m8-readonly-preflight-b399d2f3
    paths:
      - ".github/workflows/m8-private-cutover-readonly-probe.yml"

permissions:
  contents: read

jobs:
  m8-readonly-acceptance:
    name: m8-readonly-acceptance
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 15
    steps:
      - name: Prepare exact private-main candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = "F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master-core-m8-candidate"
          $expectedCommit = "b399d2f3ccd0bfbeb35699a890f681ae28afbbac"
          $expectedTree = "2ca865b168a6056e408b44d327ae300c4dc71239"
          git -C $candidate fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidate checkout main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidate reset --hard $expectedCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = (git -C $candidate rev-parse HEAD).Trim()
          $tree = (git -C $candidate rev-parse "HEAD^{tree}").Trim()
          $dirty = @(git -C $candidate status --porcelain)
          if ($head -ne $expectedCommit -or $tree -ne $expectedTree -or $dirty.Count -ne 0) { throw "Candidate exact-source verification failed." }
          Write-Host "CANDIDATE_HEAD=$head"
          Write-Host "CANDIDATE_TREE=$tree"
          Write-Host "CANDIDATE_WORKTREE=CLEAN"

      - name: Run canonical M8 read-only preflight
        shell: powershell
        run: |
          $candidate = "F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master-core-m8-candidate"
          $production = "F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $candidate "scripts\security\preflight-private-cutover.ps1") `
            -ExpectedCommit "b399d2f3ccd0bfbeb35699a890f681ae28afbbac" `
            -ExpectedTree "2ca865b168a6056e408b44d327ae300c4dc71239" `
            -RuntimeProjectRoot $production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Safety boundary
        if: always()
        shell: powershell
        run: |
          Write-Host "PRODUCTION_CUTOVER=NOT_PERFORMED"
          Write-Host "PRODUCTION_GIT_MUTATION=NONE"
          Write-Host "PROCESS_MUTATION=NONE"
          Write-Host "ARM_MUTATION=NONE"
          Write-Host "ORDER_MUTATION=NONE"
          Write-Host "POSITION_MUTATION=NONE"
          Write-Host "LIVE_TEST_ORDER=NONE"
