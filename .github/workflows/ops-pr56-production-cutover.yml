name: OPS PR56 Production Cutover

on:
  push:
    branches:
      - ops/cutover-pr56-142e7755
    paths:
      - ".github/workflows/ops-pr56-production-cutover.yml"

permissions:
  contents: read

concurrency:
  group: ops-pr56-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: pr56-production-cutover-self-hosted
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 25

    steps:
      - name: Checkout exact merged target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify exact merged target
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tree = (git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          Write-Host "CUTOVER_TARGET_HEAD=$head"
          Write-Host "CUTOVER_TARGET_TREE=$tree"
          if ($head -ne '142e7755c136f677193ef075e1816a09664fe015') { throw "CUTOVER_TARGET_HEAD_MISMATCH" }
          if ($tree -ne '7e75c35290f33e363363a9e2cab0502accbf6e53') { throw "CUTOVER_TARGET_TREE_MISMATCH" }

      - name: M8 read-only preflight
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\security\preflight-private-cutover.ps1 `
            -ExpectedCommit 142e7755c136f677193ef075e1816a09664fe015 `
            -ExpectedTree 7e75c35290f33e363363a9e2cab0502accbf6e53 `
            -RuntimeProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'

      - name: Guarded production source transition
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\rollout-phase7c-production-source-transition-local.ps1 `
            -ProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master' `
            -ExpectedCurrentCommit 812c526f58309e7cd27dde23c3f87d04bded9a9d `
            -TargetCommit 142e7755c136f677193ef075e1816a09664fe015 `
            -ExpectedRemoteMainCommit 142e7755c136f677193ef075e1816a09664fe015 `
            -ExpectedHelperBlobSha1 d8fb26409df5ddecdf5353ab0fdf42cbd8d3500f `
            -ExpectedInitialArm DISARMED `
            -ExpectedInitialRuntimeState HEALTHY `
            -TimeoutSeconds 180

      - name: P5 post-cutover read-only acceptance
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-phase7c-p5-production-acceptance-local.ps1 `
            -ProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master' `
            -ExpectedCommit 142e7755c136f677193ef075e1816a09664fe015 `
            -ApiBaseUrl 'http://127.0.0.1:3711'

      - name: Final safety boundary
        shell: powershell
        run: |
          Write-Host "PR56_PRODUCTION_CUTOVER_TARGET=142e7755c136f677193ef075e1816a09664fe015"
          Write-Host "PR56_FINAL_EXPECTED_MODE=PAUSE"
          Write-Host "PR56_FINAL_EXPECTED_ARM=DISARMED"
          Write-Host "PR56_ORDER_MUTATION=NONE"
          Write-Host "PR56_POSITION_MUTATION=NONE"
          Write-Host "PR56_LIVE_TEST_ORDER=NONE"
