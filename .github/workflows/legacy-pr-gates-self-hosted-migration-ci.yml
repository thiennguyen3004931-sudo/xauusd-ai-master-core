name: Legacy PR Gates Self-Hosted Migration CI

on:
  push:
    branches:
      - fix/self-hosted-legacy-pr-gates
    paths:
      - "scripts/test-legacy-pr-gates-self-hosted-migration.mjs"
      - ".github/workflows/legacy-pr-gates-self-hosted-migration-ci.yml"
      - ".github/workflows/phase7c-canonical-pr-gate.yml"
      - ".github/workflows/public-private-boundary-ci.yml"
      - ".github/workflows/phase7c-web-live-arm-demo-auto-ci.yml"
      - ".github/workflows/phase7c-live-arm-orphan-reconciliation-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/test-legacy-pr-gates-self-hosted-migration.mjs"
      - ".github/workflows/legacy-pr-gates-self-hosted-migration-ci.yml"
      - ".github/workflows/phase7c-canonical-pr-gate.yml"
      - ".github/workflows/public-private-boundary-ci.yml"
      - ".github/workflows/phase7c-web-live-arm-demo-auto-ci.yml"
      - ".github/workflows/phase7c-live-arm-orphan-reconciliation-ci.yml"

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        shell: powershell
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_HEAD=$env:EXPECTED_HEAD"
          Write-Host "ACTUAL_HEAD=$actual"
          if ($actual -ne $env:EXPECTED_HEAD) { exit 1 }
      - name: Legacy PR gate migration contract
        shell: powershell
        run: node --test scripts/test-legacy-pr-gates-self-hosted-migration.mjs
      - name: Diff hygiene
        shell: powershell
        run: git diff --check
