name: Phase7C Break-even setting from web (No MT5)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/phase7c-be-setting-web.test.mjs'
      - 'scripts/phase7c-break-even-config.mjs'
      - 'scripts/phase7c-break-even-config.d.mts'
      - 'scripts/lib/phase7c-account-mode.ps1'
      - 'scripts/run-phase7c-executors-local.ps1'
      - 'apps/api/src/services/phase7c-lot-settings.service.ts'
      - 'apps/api/src/routes/phase7c.route.ts'
      - 'apps/web/src/api.ts'
      - 'apps/web/src/phase7c-types.ts'
      - 'apps/web/src/ui/Phase7CControlCenterCompactSection.tsx'
      - '.github/workflows/phase7c-be-setting-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  be-setting:
    name: BE setting API/web/supervisor and TREND/SIDEWAY regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MT5_ORDER_PERMISSION: NONE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API and Web
        run: pnpm turbo run build --filter=@xauusd/api... --filter=@xauusd/web...
      - name: BE setting (defaults 6/0, ranges, legacy files, restart, supervisor export, web)
        run: node --test scripts/phase7c-be-setting-web.test.mjs
      - name: Lot / Fixed TP / BE regressions
        run: |
          node --test scripts/phase7c-break-even-config.test.mjs
          node --test scripts/phase7c-lot-settings.test.mjs
          node --test scripts/phase7c-lot-range-120.test.mjs
          node --test scripts/phase7c-fixed-tp.test.mjs
          node --test scripts/phase7c-fixed-tp-api-web.test.mjs
          node --test scripts/phase7c-fixed-tp-runtime-wiring.test.mjs
          node --test scripts/phase7c-fixed-tp-trend-exit.test.mjs
          node --test scripts/phase7c-fixed-tp-sideway-exit.test.mjs
          node --test scripts/phase7c-management-constants-inventory.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node scripts/test-phase7c-control-center-v2-compact-ui-source.mjs
