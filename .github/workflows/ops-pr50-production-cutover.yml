name: OPS PR50 Production Cutover

on:
  push:
    branches:
      - ops/cutover-pr50-429f657c
    paths:
      - ".github/workflows/ops-pr50-production-cutover.yml"

permissions:
  contents: read

concurrency:
  group: ops-pr50-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: pr50-production-cutover-self-hosted
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 20

    steps:
      - name: Checkout exact merged target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 429f657c882dfd411f72dff6ecf2e370cca9cbf6

      - name: Verify exact merged target
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tree = (git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          Write-Host "CUTOVER_TARGET_HEAD=$head"
          Write-Host "CUTOVER_TARGET_TREE=$tree"
          if ($head -ne '429f657c882dfd411f72dff6ecf2e370cca9cbf6') { throw "CUTOVER_TARGET_HEAD_MISMATCH" }
          if ($tree -ne 'f80cdb49890629438ccccacff2ed5f5bb2a2d98b') { throw "CUTOVER_TARGET_TREE_MISMATCH" }

      - name: M8 read-only preflight
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\security\preflight-private-cutover.ps1 `
            -ExpectedCommit 429f657c882dfd411f72dff6ecf2e370cca9cbf6 `
            -ExpectedTree f80cdb49890629438ccccacff2ed5f5bb2a2d98b `
            -RuntimeProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'

      - name: Guarded production source transition
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\rollout-phase7c-production-source-transition-local.ps1 `
            -ProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master' `
            -ExpectedCurrentCommit f142d62838746ada79ad3aa90573e6fa885e82f9 `
            -TargetCommit 429f657c882dfd411f72dff6ecf2e370cca9cbf6 `
            -ExpectedRemoteMainCommit 429f657c882dfd411f72dff6ecf2e370cca9cbf6 `
            -ExpectedHelperBlobSha1 d8fb26409df5ddecdf5353ab0fdf42cbd8d3500f `
            -ExpectedInitialArm DISARMED `
            -ExpectedInitialRuntimeState HEALTHY `
            -TimeoutSeconds 180

      - name: P5 post-cutover read-only acceptance
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-phase7c-p5-production-acceptance-local.ps1 `
            -ProjectRoot 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master' `
            -ExpectedCommit 429f657c882dfd411f72dff6ecf2e370cca9cbf6 `
            -ApiBaseUrl 'http://127.0.0.1:3711'

      - name: Final safety boundary
        shell: powershell
        run: |
          Write-Host "PR50_PRODUCTION_CUTOVER_TARGET=429f657c882dfd411f72dff6ecf2e370cca9cbf6"
          Write-Host "PR50_FINAL_EXPECTED_MODE=PAUSE"
          Write-Host "PR50_FINAL_EXPECTED_ARM=DISARMED"
          Write-Host "PR50_ORDER_MUTATION=NONE"
          Write-Host "PR50_POSITION_MUTATION=NONE"
          Write-Host "PR50_LIVE_TEST_ORDER=NONE"
