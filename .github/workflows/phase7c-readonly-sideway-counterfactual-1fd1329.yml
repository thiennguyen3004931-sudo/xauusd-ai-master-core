name: Phase7C Read-Only Sideway Counterfactual 1fd1329

on:
  push:
    branches:
      - ops/sideway-counterfactual-strictness-1fd1329
    paths:
      - 'scripts/diagnose-phase7c-sideway-counterfactual.mjs'
      - '.github/workflows/phase7c-readonly-sideway-counterfactual-1fd1329.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4

      - name: Run read-only Sideway counterfactual
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $prod = 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'
          $expected = '1fd1329edc684405c975a1793ae39c72384786f8'
          $actual = (git -C $prod rev-parse HEAD).Trim().ToLowerInvariant()
          Write-Host "SIDEWAY_CF_PRODUCTION_HEAD=$actual"
          if ($actual -ne $expected) { throw ("Production head mismatch. expected={0} actual={1}" -f $expected,$actual) }

          $life = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/lifecycle' -Method Get -TimeoutSec 10
          $cap = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-live-arm-control/capability' -Method Get -TimeoutSec 10
          Write-Host "SIDEWAY_CF_MODE=$([string]$life.mode.mode)"
          Write-Host "SIDEWAY_CF_ARM=$([string]$cap.liveArmStatus)"

          $audit = Join-Path $prod '.runtime\phase7c-executors\decision-observability\live\sideway-decisions.jsonl'
          node .\scripts\diagnose-phase7c-sideway-counterfactual.mjs $audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host 'SIDEWAY_CF_HTTP_METHODS=GET_ONLY_FOR_LIFECYCLE_AND_CAPABILITY'
          Write-Host 'SIDEWAY_CF_FILE_ACCESS=READ_ONLY'
          Write-Host 'SIDEWAY_CF_MODE_MUTATION=NONE'
          Write-Host 'SIDEWAY_CF_ARM_MUTATION=NONE'
          Write-Host 'SIDEWAY_CF_ORDER_MUTATION=NONE'
          Write-Host 'SIDEWAY_CF_POSITION_MUTATION=NONE'
          Write-Host 'SIDEWAY_CF_LIVE_TEST_ORDER=NONE'
