name: Phase7C Natural Position Management Read-Only Witness CI

on:
  push:
    branches:
      - feat/natural-position-management-readonly-witness
    paths:
      - "scripts/phase7c-natural-position-management-witness.mjs"
      - "scripts/test-phase7c-natural-position-management-witness.mjs"
      - ".github/workflows/phase7c-natural-position-management-readonly-witness-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/phase7c-natural-position-management-witness.mjs"
      - "scripts/test-phase7c-natural-position-management-witness.mjs"
      - ".github/workflows/phase7c-natural-position-management-readonly-witness-ci.yml"

permissions:
  contents: read

jobs:
  witness-contract:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        shell: powershell
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualHead = (git rev-parse HEAD).Trim()
          Write-Host "CHECKED_OUT_HEAD=$actualHead"
          Write-Host "EXPECTED_HEAD=$env:EXPECTED_HEAD"
          if ($actualHead -ne $env:EXPECTED_HEAD) { exit 1 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Natural position management witness contract
        run: node --test scripts/test-phase7c-natural-position-management-witness.mjs
      - name: Diff hygiene
        run: git diff --check
