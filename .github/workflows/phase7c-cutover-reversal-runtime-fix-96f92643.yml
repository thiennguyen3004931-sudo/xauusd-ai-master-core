name: Phase7C Cutover REVERSAL Runtime Fix 96f92643

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase7c-cutover-reversal-runtime-fix-96f92643.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 12
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: 96f92643c868c14c4d890f6cc10d7d8a34df26aa
          fetch-depth: 0

      - name: Guarded production cutover and REVERSAL runtime verification
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $prod = 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'
          $current = '191da69036795d6cd1d7e4ea9680d60f03a426ae'
          $target = '96f92643c868c14c4d890f6cc10d7d8a34df26aa'
          $targetTree = 'a0c460c628d63147460099a9fdcb3d8560c8e439'
          $helperBlob = 'd8fb26409df5ddecdf5353ab0fdf42cbd8d3500f'

          $actual = (git -C $prod rev-parse HEAD).Trim().ToLowerInvariant()
          Write-Host "REVERSAL_FIX_PRE_PRODUCTION_HEAD=$actual"

          if ($actual -eq $target) {
            Write-Host 'REVERSAL_FIX_TRANSITION=SKIPPED_ALREADY_TARGET'
          } elseif ($actual -eq $current) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'scripts\rollout-phase7c-production-source-transition-local.ps1') -ProjectRoot $prod -ExpectedCurrentCommit $current -TargetCommit $target -ExpectedRemoteMainCommit $target -ExpectedHelperBlobSha1 $helperBlob -ExpectedInitialArm DISARMED -ExpectedInitialRuntimeState HEALTHY -TimeoutSeconds 300
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            throw "UNEXPECTED_PRODUCTION_HEAD expected_current=$current expected_target=$target actual=$actual"
          }

          $postHead = (git -C $prod rev-parse HEAD).Trim().ToLowerInvariant()
          Write-Host "REVERSAL_FIX_POST_PRODUCTION_HEAD=$postHead"
          if ($postHead -ne $target) { throw 'Production HEAD did not reach target.' }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $prod 'scripts\security\preflight-private-cutover.ps1') -ExpectedCommit $target -ExpectedTree $targetTree -RuntimeProjectRoot $prod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $runtimeFiles = @(Get-ChildItem -LiteralPath (Join-Path $prod 'scripts') -Filter '.phase7c-trend-legacy-runtime-*.mjs' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
          if ($runtimeFiles.Count -lt 1) { throw 'No generated Trend runtime found after cutover.' }
          $latest = $runtimeFiles[0]
          $runtimeText = Get-Content -LiteralPath $latest.FullName -Raw
          $reversalCalls = ([regex]::Matches($runtimeText, 'readPhase7CReversalEntryContext\s*\(')).Count
          $reversalDefs = ([regex]::Matches($runtimeText, 'async\s+function\s+readPhase7CReversalEntryContext\s*\(')).Count
          $configDefs = ([regex]::Matches($runtimeText, 'function\s+effectiveTrendEntryConfig\s*\(')).Count
          Write-Host "REVERSAL_FIX_RUNTIME_FILE=$($latest.Name)"
          Write-Host "REVERSAL_FIX_RUNTIME_CALLS=$reversalCalls"
          Write-Host "REVERSAL_FIX_RUNTIME_FUNCTION_DEFS=$reversalDefs"
          Write-Host "REVERSAL_FIX_EFFECTIVE_CONFIG_DEFS=$configDefs"
          if ($reversalDefs -ne 1) { throw "Expected exactly one REVERSAL context definition; actual=$reversalDefs" }
          if ($configDefs -ne 1) { throw "Expected exactly one effectiveTrendEntryConfig definition; actual=$configDefs" }
          if ($reversalCalls -lt 2) { throw "Expected REVERSAL calls plus definition; actual=$reversalCalls" }

          $life = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/lifecycle' -Method Get -TimeoutSec 10
          $cap = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-live-arm-control/capability' -Method Get -TimeoutSec 10
          $mode = [string]$life.mode.mode
          $armStatus = [string]$cap.liveArmStatus
          $armed = [bool]$cap.liveExecutionArmed
          Write-Host "REVERSAL_FIX_FINAL_BOT_MODE=$mode"
          Write-Host "REVERSAL_FIX_FINAL_ARM_STATUS=$armStatus"
          Write-Host "REVERSAL_FIX_FINAL_ARMED=$armed"
          if ($mode -ne 'PAUSE') { throw "Expected PAUSE after repair; actual=$mode" }
          if ($armed -or $armStatus -ne 'DISARMED') { throw 'Expected DISARMED after repair.' }

          Write-Host 'REVERSAL_RUNTIME_FIX_PRODUCTION=PASS'
          Write-Host 'ORDER_MUTATION=NONE'
          Write-Host 'POSITION_MUTATION=NONE'
          Write-Host 'LIVE_TEST_ORDER=NONE'