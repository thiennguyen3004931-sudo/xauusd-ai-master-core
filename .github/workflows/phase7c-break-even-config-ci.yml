name: Phase7C Configurable Break-Even (No MT5)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/phase7c-break-even-config.mjs'
      - 'scripts/phase7c-break-even-config.test.mjs'
      - 'scripts/run-phase7b-demo-controller.ts'
      - 'scripts/run-phase7c-sideway-controller.mjs'
      - 'scripts/phase7c-semi-trend-adoption-runtime.mjs'
      - 'scripts/phase7c-management-constants-inventory.test.mjs'
      - 'docs/operations/phase7c-management-constants-inventory.md'
      - '.github/workflows/phase7c-break-even-config-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  break-even:
    name: BE trigger/offset config, snapshot and TREND/SIDEWAY/SEMI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MT5_ORDER_PERMISSION: NONE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Break-even config + wiring
        run: node --test scripts/phase7c-break-even-config.test.mjs
      - name: Inventory guard
        run: node --test scripts/phase7c-management-constants-inventory.test.mjs
      - name: TREND / SIDEWAY / SEMI management regressions
        run: |
          node --test scripts/phase7c-sideway-broker-tp-sl-trail-only.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node --test scripts/phase7c-fixed-tp-trend-exit.test.mjs
          node --test scripts/phase7c-fixed-tp-sideway-exit.test.mjs
          node --test scripts/phase7c-final-strategy-acceptance.test.mjs
          node --test scripts/phase7c-semi-post-entry-contract.test.mjs
          node --test scripts/phase7c-trend-m5-runtime-wiring.test.mjs
          node scripts/test-phase7c-structural-sl-monotonicity.mjs
          node scripts/test-phase7c-trend-management-path-regression.mjs
          node scripts/test-phase7c-sideway-recovery-management-contract.mjs
          node scripts/phase7c-semi-post-entry-contract.mjs
