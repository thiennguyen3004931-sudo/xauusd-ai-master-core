name: Phase7C Sideway Regime CI

on:
  push:
    branches:
      - phase7c-sideway-supply-demand
    paths:
      - "packages/strategy-engine/**"
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/api/src/services/phase7c-*.ts"
      - "apps/web/src/api.ts"
      - "apps/web/src/phase7c-types.ts"
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "apps/web/src/ui/DashboardLayout.tsx"
      - "packages/mt5-broker/**"
      - "scripts/run-phase7b-demo-controller.ts"
      - "scripts/run-phase7c-*.mjs"
      - "scripts/run-phase7c-*.ps1"
      - "scripts/report-phase7c-*.mjs"
      - "scripts/report-phase7c-*.ps1"
      - "scripts/phase7c-sideway-*.mjs"
      - "scripts/phase7c-lot-settings.test.mjs"
      - "scripts/phase7c-decision-audit*.mjs"
      - "scripts/phase7c-decision-monitor.test.mjs"
      - "scripts/phase7c-web-autostart-contract.test.mjs"
      - "scripts/install-phase7c-mt5-decision-panel-local.ps1"
      - "scripts/install-phase7c-desktop-control-local.ps1"
      - "scripts/open-phase7c-control-center-local.ps1"
      - "mt5/**"
      - "scripts/run-phase7b-web-autostart.ps1"
      - "scripts/run-phase7b-demo-web-local.ps1"
      - "scripts/phase7c-execution-lock*.mjs"
      - "scripts/phase7c-forward-report*.mjs"
      - "scripts/apply-phase7c-broker-clock-fix-local.mjs"
      - "scripts/verify-phase7c-broker-clock-local.mjs"
      - "scripts/activate-phase7c-local.ps1"
      - "scripts/stop-phase7c-executors-local.ps1"
      - "scripts/upgrade-phase7c-executor-task-local.ps1"
      - "scripts/upgrade-phase7c-executor-task-startup-local.ps1"
      - "scripts/verify-phase7c-executors-local.ps1"
      - "scripts/verify-phase7c-executor-startup-task-local.ps1"
      - "scripts/install-phase7c-forward-dashboard-task-local.ps1"
      - "scripts/verify-phase7c-forward-dashboard-task-local.ps1"
      - ".github/workflows/phase7c-sideway-regime-ci.yml"
  pull_request:
    paths:
      - "packages/strategy-engine/**"
      - "apps/api/src/routes/phase7c.route.ts"
      - "apps/api/src/services/phase7c-*.ts"
      - "apps/web/src/api.ts"
      - "apps/web/src/phase7c-types.ts"
      - "apps/web/src/pages/Phase7CControlCenterPage.tsx"
      - "apps/web/src/ui/DashboardLayout.tsx"
      - "packages/mt5-broker/**"
      - "scripts/run-phase7b-demo-controller.ts"
      - "scripts/run-phase7c-*.mjs"
      - "scripts/run-phase7c-*.ps1"
      - "scripts/report-phase7c-*.mjs"
      - "scripts/report-phase7c-*.ps1"
      - "scripts/phase7c-sideway-*.mjs"
      - "scripts/phase7c-lot-settings.test.mjs"
      - "scripts/phase7c-decision-audit*.mjs"
      - "scripts/phase7c-decision-monitor.test.mjs"
      - "scripts/phase7c-web-autostart-contract.test.mjs"
      - "scripts/install-phase7c-mt5-decision-panel-local.ps1"
      - "scripts/install-phase7c-desktop-control-local.ps1"
      - "scripts/open-phase7c-control-center-local.ps1"
      - "mt5/**"
      - "scripts/run-phase7b-web-autostart.ps1"
      - "scripts/run-phase7b-demo-web-local.ps1"
      - "scripts/phase7c-execution-lock*.mjs"
      - "scripts/phase7c-forward-report*.mjs"
      - "scripts/apply-phase7c-broker-clock-fix-local.mjs"
      - "scripts/verify-phase7c-broker-clock-local.mjs"
      - "scripts/activate-phase7c-local.ps1"
      - "scripts/stop-phase7c-executors-local.ps1"
      - "scripts/upgrade-phase7c-executor-task-local.ps1"
      - "scripts/upgrade-phase7c-executor-task-startup-local.ps1"
      - "scripts/verify-phase7c-executors-local.ps1"
      - "scripts/verify-phase7c-executor-startup-task-local.ps1"
      - "scripts/install-phase7c-forward-dashboard-task-local.ps1"
      - "scripts/verify-phase7c-forward-dashboard-task-local.ps1"
      - ".github/workflows/phase7c-sideway-regime-ci.yml"

concurrency:
  group: phase7c-sideway-regime-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test MT5 Bridge reconnect safety
        working-directory: packages/mt5-broker/bridge
        run: |
          python -m pip install "pydantic>=2.12,<3"
          python -m compileall -q mt5_bridge tests
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Build strategy-engine dependency graph
        run: pnpm --filter @xauusd/strategy-engine... build

      - name: Typecheck strategy-engine
        run: pnpm --filter @xauusd/strategy-engine typecheck

      - name: Test strategy-engine
        run: pnpm --filter @xauusd/strategy-engine test

      - name: Test Phase7C execution logic
        run: |
          node --test scripts/phase7c-sideway-logic.test.mjs
          node --test scripts/phase7c-sideway-execution-guards.test.mjs
          node --test scripts/phase7c-execution-lock.test.mjs
          node --test scripts/phase7c-forward-report.test.mjs

      - name: Build API dependency graph
        run: pnpm --filter @xauusd/api... build

      - name: Test Phase7C lot settings
        run: |
          node --test scripts/phase7c-lot-settings.test.mjs
          node --test scripts/phase7c-decision-audit.test.mjs
          node --import ./apps/api/node_modules/tsx/dist/loader.mjs --test scripts/phase7c-decision-monitor.test.mjs
          node --test scripts/phase7c-web-autostart-contract.test.mjs

      - name: Build Phase7C web
        run: pnpm --filter @xauusd/web... build

      - name: Validate legacy Trend ESM transform
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs");
          const ts = require("typescript");
          const source = fs.readFileSync("scripts/run-phase7b-demo-controller.ts", "utf8");
          const transformed = ts.transpileModule(source, {
            fileName: "run-phase7b-demo-controller.ts",
            reportDiagnostics: true,
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
              moduleResolution: ts.ModuleResolutionKind.Bundler,
              verbatimModuleSyntax: false,
            },
          });
          const errors = (transformed.diagnostics || []).filter(
            (diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error,
          );
          if (errors.length) {
            for (const diagnostic of errors) {
              console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, " "));
            }
            process.exit(1);
          }
          fs.writeFileSync(".phase7c-trend-legacy-ci.mjs", transformed.outputText, "utf8");
          '@ | Set-Content -Path .phase7c-trend-transform-ci.cjs -Encoding utf8
          node .phase7c-trend-transform-ci.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .phase7c-trend-legacy-ci.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .phase7c-trend-transform-ci.cjs,.phase7c-trend-legacy-ci.mjs -Force

      - name: Parse Phase7C Node controllers
        shell: pwsh
        run: |
          node --check scripts/run-phase7c-telegram-mode-controller.mjs
          node --check scripts/run-phase7c-regime-notifier.mjs
          node --check scripts/run-phase7c-auto-journal.mjs
          node --check scripts/run-phase7c-forward-dashboard.mjs
          node --check scripts/run-phase7c-trend-controller.mjs
          node --check scripts/phase7c-sideway-logic.mjs
          node --check scripts/phase7c-sideway-execution-guards.mjs
          node --check scripts/phase7c-execution-lock.mjs
          node --check scripts/phase7c-forward-report-utils.mjs
          node --check scripts/phase7c-decision-audit.mjs
          node --check scripts/report-phase7c-forward.mjs
          node --check scripts/run-phase7c-sideway-controller.mjs
          node --check scripts/run-phase7c-sideway-locked.mjs
          node --check scripts/apply-phase7c-broker-clock-fix-local.mjs
          node --check scripts/verify-phase7c-broker-clock-local.mjs

      - name: Dry-run broker clock controller patch
        shell: pwsh
        run: |
          node scripts/apply-phase7c-broker-clock-fix-local.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchRoot = Join-Path $PWD ".phase7c-broker-clock-ci"
          Remove-Item $patchRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $patchRoot "scripts") | Out-Null
          Copy-Item scripts/run-phase7b-demo-controller.ts (Join-Path $patchRoot "scripts")
          Copy-Item scripts/run-phase7c-sideway-controller.mjs (Join-Path $patchRoot "scripts")
          $previousPatchRoot = $env:PHASE7C_BROKER_CLOCK_PATCH_ROOT
          try {
            $env:PHASE7C_BROKER_CLOCK_PATCH_ROOT = $patchRoot
            node scripts/apply-phase7c-broker-clock-fix-local.mjs --apply
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PHASE7C_BROKER_CLOCK_PATCH_ROOT = $previousPatchRoot
          }
          node --check (Join-Path $patchRoot "scripts/run-phase7c-sideway-controller.mjs")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trendSource = Get-Content (Join-Path $patchRoot "scripts/run-phase7b-demo-controller.ts") -Raw
          $sidewaySource = Get-Content (Join-Path $patchRoot "scripts/run-phase7c-sideway-controller.mjs") -Raw
          if (-not $trendSource.Contains('const now = Number(quote.timestamp);')) { throw "BROKER_CLOCK_TREND_NOW_ASSERTION_MISSING" }
          if (-not $trendSource.Contains('managed.partialActivatedAt = Number(quote.timestamp);')) { throw "BROKER_CLOCK_PARTIAL_ASSERTION_MISSING" }
          if (-not $sidewaySource.Contains('brokerClockOffsetMs')) { throw "BROKER_CLOCK_SIDEWAY_OFFSET_ASSERTION_MISSING" }
          Remove-Item $patchRoot -Recurse -Force

      - name: Parse Phase7C PowerShell launchers
        shell: pwsh
        run: |
          $files = @(
            "scripts/run-phase7c-telegram-mode-controller-local.ps1",
            "scripts/run-phase7c-regime-notifier-local.ps1",
            "scripts/run-phase7c-auto-journal-local.ps1",
            "scripts/run-phase7c-forward-dashboard-local.ps1",
            "scripts/run-phase7c-forward-dashboard-task-runner-local.ps1",
            "scripts/run-phase7c-forward-report-refresh-local.ps1",
            "scripts/run-phase7c-executor-task-runner-local.ps1",
            "scripts/report-phase7c-forward-local.ps1",
            "scripts/run-phase7c-trend-controller-local.ps1",
            "scripts/run-phase7c-sideway-controller-local.ps1",
            "scripts/run-phase7b-api-runtime-local.ps1",
            "scripts/run-phase7b-web-autostart.ps1",
            "scripts/run-phase7b-demo-web-local.ps1",
            "scripts/run-phase7c-executors-local.ps1",
            "scripts/stop-phase7c-executors-local.ps1",
            "scripts/activate-phase7c-local.ps1",
            "scripts/upgrade-phase7c-executor-task-local.ps1",
            "scripts/upgrade-phase7c-executor-task-startup-local.ps1",
            "scripts/verify-phase7c-executors-local.ps1",
            "scripts/verify-phase7c-executor-startup-task-local.ps1",
            "scripts/install-phase7c-forward-dashboard-task-local.ps1",
            "scripts/verify-phase7c-forward-dashboard-task-local.ps1",
            "scripts/install-phase7c-mt5-decision-panel-local.ps1",
            "scripts/open-phase7c-control-center-local.ps1",
            "scripts/install-phase7c-desktop-control-local.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
            Write-Host "PHASE7C_POWERSHELL_PARSE_PASS=$file"
          }

      - name: Verify MT5 panel is read-only
        shell: pwsh
        run: |
          $panel = Get-Content mt5/XAUUSD_AI_Master_Decision_Panel.mq5 -Raw
          if (-not $panel.Contains('WebRequest("GET"')) { throw "MT5_PANEL_GET_ASSERTION_MISSING" }
          if (-not $panel.Contains('ORDER PERMISSION = ')) { throw "MT5_PANEL_PERMISSION_ASSERTION_MISSING" }
          if ($panel -match 'OrderSend|CTrade|PositionClose|PositionModify') { throw "MT5_PANEL_WRITE_PRIMITIVE_FORBIDDEN" }

      - name: Validate unarmed activation contract
        shell: pwsh
        run: |
          function Assert-Literal([string]$Path, [string]$Needle) {
            $content = Get-Content $Path -Raw
            if (-not $content.Contains($Needle)) { throw "MISSING_LITERAL=$Path|$Needle" }
          }
          Assert-Literal 'scripts/activate-phase7c-local.ps1' '$preflightArgs += "-Once"'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_EXECUTORS_SHADOW=PASS'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_EXECUTOR_SUPERVISOR_MODE=TELEGRAM_ONLY'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' "pnpm --filter '@xauusd/api...' build"
          Assert-Literal 'scripts/activate-phase7c-local.ps1' "pnpm --filter '@xauusd/web...' build"
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_LOT_ACTIVE=PASS'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' '$expectedActiveArmed = $ArmExecutors.IsPresent'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' '$activeProbe.restartRequired -eq $false'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' '$activeProbe.restartRequired -eq $true'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'SHADOW_BOUND_UNARMED'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_ENTRY_FREEZE_MODE=PERSISTENT_BOT_MODE_PRESERVED'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_BOT_STALE_RECOVERY=SAFE_COLD_START_PENDING_LOCAL_AND_BROKER_CHECKS'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_MT5_OFFLINE_RECOVERY=SAFE_RESTART_PENDING_LOCAL_AND_BROKER_CHECKS'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'MT5_OFFLINE_PLUS_LOCAL_STATE_PLUS_BRIDGE'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_CORE_PORTS_CLEAN=PASS'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'Stop-ProjectCoreProcesses'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'phase7b-(api|web)-background-v\d+'
          Assert-Literal 'scripts/activate-phase7c-local.ps1' 'PHASE7C_ACTIVATE_LOT_ACTIVE_DETAIL'
          Assert-Literal 'scripts/stop-phase7c-executors-local.ps1' 'PHASE7C_EXECUTOR_STOP=FAIL|REMAINING='
          Assert-Literal 'scripts/run-phase7b-api-runtime-local.ps1' 'PHASE7C_LOT_SETTINGS_FILE'
          Assert-Literal 'scripts/run-phase7b-api-runtime-local.ps1' 'PHASE7C_ACTIVE_LOT_SETTINGS_FILE'
          Assert-Literal 'scripts/run-phase7b-api-runtime-local.ps1' 'PHASE7C_RUNTIME_ROOT'
