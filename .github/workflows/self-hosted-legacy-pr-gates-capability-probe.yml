name: Legacy PR Gate Self-Hosted Capability Probe

on:
  push:
    branches:
      - fix/self-hosted-legacy-pr-gates
    paths:
      - ".github/workflows/self-hosted-legacy-pr-gates-capability-probe.yml"

permissions:
  contents: read

jobs:
  capability-probe:
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact head
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_HEAD=${{ github.sha }}"
          Write-Host "ACTUAL_HEAD=$actual"
          if ($actual -ne "${{ github.sha }}") { exit 1 }
      - name: Collect runner capabilities
        shell: powershell
        run: |
          function Probe-Command([string]$Name, [scriptblock]$VersionCommand) {
            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            if ($null -eq $cmd) {
              Write-Host ("CAPABILITY_{0}=NO" -f $Name.ToUpper())
              return
            }
            Write-Host ("CAPABILITY_{0}=YES" -f $Name.ToUpper())
            & $VersionCommand
          }

          Write-Host "CAPABILITY_WINDOWS_POWERSHELL=YES"
          $PSVersionTable.PSVersion
          Probe-Command "pwsh" { pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' }
          Probe-Command "git" { git --version }
          Probe-Command "python" { python --version }
          Probe-Command "node" { node --version }
          Probe-Command "docker" { docker version }
