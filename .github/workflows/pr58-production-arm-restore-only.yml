name: PR58 Production ARM Restore Only

on:
  push:
    branches:
      - ops/pr58-arm-restore-4aeff4e6
    paths:
      - ".github/workflows/pr58-production-arm-restore-only.yml"

permissions:
  contents: read

jobs:
  arm-only:
    name: pr58-production-arm-restore-self-hosted
    runs-on: [self-hosted, Windows, X64, xauusd-core-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          clean: true

      - name: Pre-ARM production safety gate
        shell: powershell
        env:
          MAIN_HEAD: 4aeff4e62c5acecb85c8c344184f962fd7121928
          PROD_HEAD: 4aeff4e62c5acecb85c8c344184f962fd7121928
          PROD_TREE: 7a6542f7fc839d9743e42d3e32dc28aba3c2b7b1
          PRODUCTION_ROOT: F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master
        run: |
          $ErrorActionPreference = 'Stop'
          $repoHead = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $prodHead = (git -C $env:PRODUCTION_ROOT rev-parse HEAD).Trim().ToLowerInvariant()
          $prodTree = (git -C $env:PRODUCTION_ROOT rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          $prodDirty = @(git -C $env:PRODUCTION_ROOT status --porcelain --untracked-files=normal | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })

          $bot = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/bot-mode' -Method Get -TimeoutSec 10
          $life = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/lifecycle' -Method Get -TimeoutSec 10
          $cap = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-live-arm-control/capability' -Method Get -TimeoutSec 10
          $src = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/runtime-source-attestation' -Method Get -TimeoutSec 10
          $auto = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-auto-activation/status' -Method Get -TimeoutSec 10

          Write-Host "PRE_ARM_PRIVATE_MAIN=$repoHead"
          Write-Host "PRE_ARM_PRODUCTION_HEAD=$prodHead"
          Write-Host "PRE_ARM_PRODUCTION_TREE=$prodTree"
          Write-Host "PRE_ARM_DIRTY_COUNT=$($prodDirty.Count)"
          Write-Host "PRE_ARM_BOT_MODE=$($bot.state.mode)"
          Write-Host "PRE_ARM_READY=$($life.ready)"
          Write-Host "PRE_ARM_TELEGRAM_READY=$($life.telegramReady)"
          Write-Host "PRE_ARM_STATUS=$($cap.liveArmStatus)"
          Write-Host "PRE_ARM_ARMED=$($cap.liveExecutionArmed)"
          Write-Host "PRE_ARM_SOURCE=$($src.overall)"
          Write-Host "PRE_ARM_SOURCE_COMMIT=$($src.deployment.sourceCommit)"
          Write-Host "PRE_ARM_POSITIONS=$($life.bridge.openXauusdPositions)"
          Write-Host "PRE_ARM_PENDING_ZERO=$($auto.checks.zeroXauusdPendingOrders)"

          if ($repoHead -ne $env:MAIN_HEAD) { throw 'PRIVATE_MAIN_HEAD_MISMATCH' }
          if ($prodHead -ne $env:PROD_HEAD) { throw 'PRODUCTION_HEAD_MISMATCH' }
          if ($prodTree -ne $env:PROD_TREE) { throw 'PRODUCTION_TREE_MISMATCH' }
          if ($prodDirty.Count -ne 0) { throw 'PRODUCTION_WORKTREE_DIRTY' }
          if ([string]$bot.state.mode -ne 'PAUSE') { throw 'BOT_MODE_NOT_PAUSE' }
          if ($life.running -ne $true -or $life.ready -ne $true -or $life.telegramReady -ne $true) { throw 'LIFECYCLE_NOT_READY' }
          if ([string]$cap.liveArmStatus -ne 'DISARMED' -or $cap.liveExecutionArmed -ne $false) { throw 'PRE_ARM_EXPECTED_DISARMED' }
          if ([string]$src.overall -ne 'EXACT_MATCH' -or [string]$src.deployment.sourceCommit -ne $env:PROD_HEAD) { throw 'RUNTIME_SOURCE_NOT_EXACT' }
          if ([int]$life.bridge.openXauusdPositions -ne 0) { throw 'XAUUSD_POSITION_COUNT_NOT_ZERO' }
          if ($auto.checks.zeroXauusdPendingOrders -ne $true) { throw 'XAUUSD_PENDING_ORDER_GATE_NOT_ZERO' }

      - name: ARM LIVE only
        shell: powershell
        run: |
          $root = 'F:\Project\XAUUSD_AI_MASTER\xauusd-ai-master'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\arm-phase7c-live-local.ps1" -WorkDir "$root\.runtime" -ControlApiUrl 'http://127.0.0.1:3711'
          if ($LASTEXITCODE -ne 0) { throw "ARM_ONLY_FAILED exit=$LASTEXITCODE" }

      - name: Post-ARM verification
        shell: powershell
        env:
          PROD_HEAD: 4aeff4e62c5acecb85c8c344184f962fd7121928
        run: |
          $bot = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/bot-mode' -Method Get -TimeoutSec 10
          $life = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/lifecycle' -Method Get -TimeoutSec 10
          $cap = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-live-arm-control/capability' -Method Get -TimeoutSec 10
          $src = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c/runtime-source-attestation' -Method Get -TimeoutSec 10
          $auto = Invoke-RestMethod -Uri 'http://127.0.0.1:3711/api/v1/phase7c-auto-activation/status' -Method Get -TimeoutSec 10

          Write-Host "POST_ARM_BOT_MODE=$($bot.state.mode)"
          Write-Host "POST_ARM_READY=$($life.ready)"
          Write-Host "POST_ARM_TELEGRAM_READY=$($life.telegramReady)"
          Write-Host "POST_ARM_STATUS=$($cap.liveArmStatus)"
          Write-Host "POST_ARM_ARMED=$($cap.liveExecutionArmed)"
          Write-Host "POST_ARM_SOURCE=$($src.overall)"
          Write-Host "POST_ARM_SOURCE_COMMIT=$($src.deployment.sourceCommit)"
          Write-Host "POST_ARM_POSITIONS=$($life.bridge.openXauusdPositions)"
          Write-Host "POST_ARM_PENDING_ZERO=$($auto.checks.zeroXauusdPendingOrders)"

          if ([string]$bot.state.mode -ne 'PAUSE') { throw 'POST_ARM_MODE_NOT_PAUSE' }
          if ($life.running -ne $true -or $life.ready -ne $true -or $life.telegramReady -ne $true) { throw 'POST_ARM_LIFECYCLE_NOT_READY' }
          if ([string]$cap.liveArmStatus -ne 'ARMED' -or $cap.liveExecutionArmed -ne $true) { throw 'POST_ARM_NOT_ARMED' }
          if ([string]$src.overall -ne 'EXACT_MATCH' -or [string]$src.deployment.sourceCommit -ne $env:PROD_HEAD) { throw 'POST_ARM_RUNTIME_SOURCE_NOT_EXACT' }
          if ([int]$life.bridge.openXauusdPositions -ne 0) { throw 'POST_ARM_POSITION_COUNT_NOT_ZERO' }
          if ($auto.checks.zeroXauusdPendingOrders -ne $true) { throw 'POST_ARM_PENDING_ORDER_GATE_NOT_ZERO' }

          Write-Host 'ARM_ONLY_ACCEPTANCE=PASS'
          Write-Host 'AUTO_MUTATION=NONE'
          Write-Host 'ORDER_MUTATION=NONE'
          Write-Host 'POSITION_MUTATION=NONE'
          Write-Host 'LIVE_TEST_ORDER=NONE'
